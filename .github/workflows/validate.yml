name: Validate battle engine

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - refactor/battle-engine

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test battle engine
        run: npm run test:battle-engine

      - name: Build
        run: npm run build
